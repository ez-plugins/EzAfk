name: CI

on:
  pull_request:
    branches: [ v2.x, v3.x ]

permissions:
  contents: read
  id-token: write

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and install MockBukkit (minecraft/v26 HEAD)
        run: |
          git clone --depth=1 --branch minecraft/v26 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          MBVER="dev-$(git -C /tmp/MockBukkit rev-parse --short HEAD)"
          echo "MOCKBUKKIT_VERSION=$MBVER" >> "$GITHUB_ENV"
          cd /tmp/MockBukkit && ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Run unit tests
        run: mvn -B -ntp -pl ezafk-core -am -Dmockbukkit.version="$MOCKBUKKIT_VERSION" org.jacoco:jacoco-maven-plugin:0.8.14:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.14:report

      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ezafk-core/target/site/jacoco/jacoco.xml
          flags: unit
          name: unit-tests

  feature-tests:
    name: Feature tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and install MockBukkit (minecraft/v26 HEAD)
        run: |
          git clone --depth=1 --branch minecraft/v26 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          MBVER="dev-$(git -C /tmp/MockBukkit rev-parse --short HEAD)"
          echo "MOCKBUKKIT_VERSION=$MBVER" >> "$GITHUB_ENV"
          cd /tmp/MockBukkit && ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Run feature tests
        run: mvn -B -ntp -pl ezafk-core -am -Dtest=*FeatureTest -Dmockbukkit.version="$MOCKBUKKIT_VERSION" org.jacoco:jacoco-maven-plugin:0.8.14:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.14:report -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload feature test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ezafk-core/target/site/jacoco/jacoco.xml
          flags: feature
          name: feature-tests

